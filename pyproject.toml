[project]
name = "nobody-ceo"
version = "0.1.0"
description = "CEO agéntico de NØBØĐ¥ RECORDS — solo lectura en v0.1"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "python-telegram-bot>=21.0",
    "google-api-python-client>=2.149.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth>=2.35.0",
    "spotipy>=2.24.0",
    "python-dotenv>=1.0.1",
]

# La ingesta de catálogo (agents/capabilities/catalogue.py) usa ffprobe vía
# subprocess para leer duración/formato sin decodificar el archivo completo.
# Requiere ffmpeg/ffprobe instalado y en PATH — no es una dependencia de Python.

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["brain*", "agents*", "integrations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
